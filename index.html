<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trackary</title>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: #e4e4e0;
    --text: #1c1c1a;
    --muted: #6f6f6a;
    --accent: #1c1c1a;
    --danger: #b3261e;
    --bar: #d3d3cd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 24px 0;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; }
  .header-actions { display: flex; gap: 16px; }
  .header-actions button {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .header-actions button:hover { color: var(--text); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }

  h2.section {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
  }

  button {
    font: inherit;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
  }
  button:hover { border-color: #c8c8c2; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: #333330; }
  button.link {
    border: none;
    background: none;
    padding: 0;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  button.link:hover { color: var(--text); }
  button.link.danger { color: var(--danger); }

  input, select, textarea {
    font: inherit;
    font-size: 0.9rem;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #9a9a94;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 12px 0 4px;
  }

  /* Sidebar */
  .tracker-item {
    display: flex;
    align-items: center;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .tracker-item:hover { background: #f1f1ee; }
  .tracker-item.active { background: var(--surface); border-color: var(--border); }
  .tracker-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 9px;
    flex-shrink: 0;
  }
  .tracker-item .name {
    flex: 1;
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tracker-item .count { color: var(--muted); font-size: 0.78rem; margin-left: 8px; }
  #new-tracker-btn { width: 100%; margin-top: 12px; }

  /* Detail */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }
  .detail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .detail-head h2 { font-size: 1.25rem; font-weight: 600; }
  .detail-head .actions { display: flex; gap: 14px; }

  .stats {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    padding: 16px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .stat .value { font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 0.78rem; color: var(--muted); }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 72px;
    margin-bottom: 24px;
  }
  .chart .bar {
    flex: 1;
    background: var(--bar);
    border-radius: 2px;
    min-height: 2px;
    position: relative;
  }
  .chart .bar.nonzero { background: var(--chart-color, #1c1c1a); }
  .chart .bar:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    font-size: 0.75rem;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 2;
  }
  .chart-caption {
    font-size: 0.78rem;
    color: var(--muted);
    margin: -18px 0 20px;
  }

  .entry-form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .entry-form input[name="value"] { width: 96px; }
  .entry-form input[name="note"] { flex: 1; min-width: 140px; }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  th { color: var(--muted); font-size: 0.78rem; font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.when { color: var(--muted); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td .del-entry { visibility: hidden; }
  tr:hover .del-entry { visibility: visible; }

  .empty { color: var(--muted); text-align: center; padding: 48px 16px; font-size: 0.9rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }

  dialog {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: min(400px, 90vw);
    margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.25); }
  dialog h3 { font-size: 1rem; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>Trackary</h1>
  <div class="header-actions">
    <button id="export-btn" title="Download all data as JSON">Export</button>
    <button id="import-btn" title="Import data from a JSON export">Import</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  </div>
</header>

<main>
  <aside>
    <h2 class="section">Trackers</h2>
    <div id="tracker-list"></div>
    <button id="new-tracker-btn">New tracker</button>
  </aside>

  <section id="detail">
    <div class="card"><div class="empty">Select a tracker, or create one to get started.</div></div>
  </section>
</main>

<dialog id="tracker-dialog">
  <h3 id="tracker-dialog-title">New tracker</h3>
  <form method="dialog" id="tracker-form">
    <label for="t-name">Name</label>
    <input id="t-name" required maxlength="60" placeholder="e.g. Running, Coffee, Expenses">
    <label for="t-unit">Unit (optional)</label>
    <input id="t-unit" maxlength="20" placeholder="e.g. km, cups, $">
    <label for="t-color">Color</label>
    <input id="t-color" type="color" value="#1c1c1a" style="height:36px; padding:3px;">
    <div class="dialog-actions">
      <button type="button" id="tracker-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "trackary.v1";

  /** @type {{trackers: Array<{id:string,name:string,unit:string,color:string,createdAt:string}>, entries: Array<{id:string,trackerId:string,value:number,note:string,at:string}>}} */
  let state = load();
  let selectedId = state.trackers[0] ? state.trackers[0].id : null;
  let editingId = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.trackers) && Array.isArray(parsed.entries)) return parsed;
      }
    } catch (e) { /* corrupted storage falls through to fresh state */ }
    return { trackers: [], entries: [] };
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  const $ = (sel) => document.querySelector(sel);

  // ---------- Tracker list ----------

  function renderList() {
    const list = $("#tracker-list");
    list.innerHTML = "";
    if (state.trackers.length === 0) {
      list.innerHTML = '<div class="muted">No trackers yet.</div>';
      return;
    }
    for (const t of state.trackers) {
      const count = state.entries.filter((e) => e.trackerId === t.id).length;
      const item = document.createElement("div");
      item.className = "tracker-item" + (t.id === selectedId ? " active" : "");
      item.innerHTML =
        '<span class="dot" style="background:' + t.color + '"></span>' +
        '<span class="name"></span><span class="count">' + count + "</span>";
      item.querySelector(".name").textContent = t.name;
      item.addEventListener("click", () => {
        selectedId = t.id;
        render();
      });
      list.appendChild(item);
    }
  }

  // ---------- Detail view ----------

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      ", " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function dayKey(iso) {
    return iso.slice(0, 10);
  }

  function computeStats(entries) {
    const total = entries.reduce((s, e) => s + e.value, 0);
    const days = new Set(entries.map((e) => dayKey(e.at)));
    // Current streak: consecutive days ending today or yesterday with at least one entry.
    let streak = 0;
    const cursor = new Date();
    if (!days.has(cursor.toISOString().slice(0, 10))) cursor.setDate(cursor.getDate() - 1);
    while (days.has(cursor.toISOString().slice(0, 10))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return { count: entries.length, total, activeDays: days.size, streak };
  }

  function renderChart(entries, color) {
    // Last 14 days, summed per day.
    const days = [];
    const today = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    const sums = days.map((k) => entries.filter((e) => dayKey(e.at) === k).reduce((s, e) => s + e.value, 0));
    const max = Math.max(...sums, 1);
    return '<div class="chart" style="--chart-color:' + color + '">' + days.map((k, i) =>
      '<div class="bar' + (sums[i] > 0 ? " nonzero" : "") + '" style="height:' +
      Math.max(Math.round((sums[i] / max) * 100), 3) + '%" data-tip="' +
      k.slice(5) + ": " + sums[i] + '"></div>'
    ).join("") + '</div><div class="chart-caption">Last 14 days</div>';
  }

  function render() {
    renderList();
    const detail = $("#detail");
    const t = state.trackers.find((x) => x.id === selectedId);
    if (!t) {
      detail.innerHTML = '<div class="card"><div class="empty">Select a tracker, or create one to get started.</div></div>';
      return;
    }
    const entries = state.entries
      .filter((e) => e.trackerId === t.id)
      .sort((a, b) => b.at.localeCompare(a.at));
    const s = computeStats(entries);
    const unit = t.unit ? " " + t.unit : "";

    detail.innerHTML =
      '<div class="card">' +
      '<div class="detail-head">' +
        '<h2 id="d-name"></h2>' +
        '<div class="actions">' +
          '<button class="link" id="edit-tracker-btn">Edit</button>' +
          '<button class="link danger" id="delete-tracker-btn">Delete</button>' +
        "</div>" +
      "</div>" +
      '<div class="stats">' +
        '<div class="stat"><div class="value">' + s.count + '</div><div class="label">entries</div></div>' +
        '<div class="stat"><div class="value">' + (Math.round(s.total * 100) / 100) + '</div><div class="label">total' + unit + "</div></div>" +
        '<div class="stat"><div class="value">' + s.activeDays + '</div><div class="label">active days</div></div>' +
        '<div class="stat"><div class="value">' + s.streak + '</div><div class="label">day streak</div></div>' +
      "</div>" +
      renderChart(entries, t.color) +
      '<form class="entry-form" id="entry-form">' +
        '<input name="value" type="number" step="any" value="1" required title="Amount">' +
        '<input name="note" placeholder="Note (optional)" maxlength="200">' +
        '<button type="submit" class="primary">Log</button>' +
      "</form>" +
      (entries.length === 0
        ? '<div class="empty">No entries yet. Log your first one above.</div>'
        : '<table><thead><tr><th>When</th><th>Value</th><th>Note</th><th></th></tr></thead><tbody>' +
          entries.map((e) =>
            "<tr data-id=\"" + e.id + '"><td class="when">' + fmtDate(e.at) + '</td><td class="num">' + e.value + unit +
            '</td><td class="note-cell"></td>' +
            '<td style="text-align:right"><button class="link danger del-entry">Delete</button></td></tr>'
          ).join("") +
          "</tbody></table>") +
      "</div>";

    $("#d-name").textContent = t.name;
    // Notes are user text; set via textContent to avoid HTML injection.
    detail.querySelectorAll("tbody tr").forEach((row, i) => {
      row.querySelector(".note-cell").textContent = entries[i].note || "";
    });

    $("#entry-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const form = ev.target;
      const value = parseFloat(form.value.value);
      if (!isFinite(value)) return;
      state.entries.push({
        id: uid(),
        trackerId: t.id,
        value,
        note: form.note.value.trim(),
        at: new Date().toISOString(),
      });
      save();
      render();
    });

    detail.querySelectorAll(".del-entry").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.closest("tr").dataset.id;
        state.entries = state.entries.filter((e) => e.id !== id);
        save();
        render();
      });
    });

    $("#edit-tracker-btn").addEventListener("click", () => openTrackerDialog(t));
    $("#delete-tracker-btn").addEventListener("click", () => {
      if (!confirm('Delete "' + t.name + '" and all its entries?')) return;
      state.trackers = state.trackers.filter((x) => x.id !== t.id);
      state.entries = state.entries.filter((e) => e.trackerId !== t.id);
      selectedId = state.trackers[0] ? state.trackers[0].id : null;
      save();
      render();
    });
  }

  // ---------- Tracker dialog ----------

  const dialog = $("#tracker-dialog");

  function openTrackerDialog(tracker) {
    editingId = tracker ? tracker.id : null;
    $("#tracker-dialog-title").textContent = tracker ? "Edit tracker" : "New tracker";
    $("#t-name").value = tracker ? tracker.name : "";
    $("#t-unit").value = tracker ? tracker.unit : "";
    $("#t-color").value = tracker ? tracker.color : "#1c1c1a";
    dialog.showModal();
  }

  $("#new-tracker-btn").addEventListener("click", () => openTrackerDialog(null));
  $("#tracker-cancel").addEventListener("click", () => dialog.close());

  $("#tracker-form").addEventListener("submit", () => {
    const name = $("#t-name").value.trim();
    if (!name) return;
    const unit = $("#t-unit").value.trim();
    const color = $("#t-color").value;
    if (editingId) {
      const t = state.trackers.find((x) => x.id === editingId);
      Object.assign(t, { name, unit, color });
    } else {
      const t = { id: uid(), name, unit, color, createdAt: new Date().toISOString() };
      state.trackers.push(t);
      selectedId = t.id;
    }
    save();
    render();
  });

  // ---------- Export / import ----------

  $("#export-btn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "trackary-export-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("#import-btn").addEventListener("click", () => $("#import-file").click());
  $("#import-file").addEventListener("change", (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    file.text().then((text) => {
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.trackers) || !Array.isArray(parsed.entries)) {
        throw new Error("Not a Trackary export");
      }
      if (!confirm("Replace current data with imported data?")) return;
      state = parsed;
      selectedId = state.trackers[0] ? state.trackers[0].id : null;
      save();
      render();
    }).catch((err) => alert("Import failed: " + err.message));
    ev.target.value = "";
  });

  render();
})();
</script>
</body>
</html>
