<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trackary — track anything</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f2330;
    --text: #e8eaf0;
    --muted: #8a90a3;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --danger: #ff5b6e;
    --ok: #3ecf8e;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid #262b38;
  }
  header h1 { font-size: 20px; letter-spacing: 0.3px; }
  header h1 span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid #262b38;
    border-radius: var(--radius);
    padding: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    background: var(--panel-2);
    color: var(--text);
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.2); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  button.small { padding: 4px 10px; font-size: 12px; }

  input, select, textarea {
    font: inherit;
    width: 100%;
    background: var(--panel-2);
    border: 1px solid #2c3245;
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }

  .tracker-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 6px;
    border: 1px solid transparent;
  }
  .tracker-item:hover { background: var(--panel-2); }
  .tracker-item.active { background: var(--panel-2); border-color: var(--accent); }
  .tracker-item .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .tracker-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tracker-item .count { color: var(--muted); font-size: 12px; margin-left: 8px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--panel-2);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat .value { font-size: 22px; font-weight: 600; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  .entry-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .entry-form input[name="value"] { width: 110px; }
  .entry-form input[name="note"] { flex: 1; min-width: 160px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #262b38; font-size: 14px; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  td.num { font-variant-numeric: tabular-nums; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 90px;
    margin-bottom: 16px;
    padding: 8px;
    background: var(--panel-2);
    border-radius: 8px;
  }
  .chart .bar {
    flex: 1;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    position: relative;
  }
  .chart .bar:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    white-space: nowrap;
    z-index: 2;
  }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 16px;
  }
  .muted { color: var(--muted); font-size: 13px; }

  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2c3245;
    border-radius: var(--radius);
    padding: 24px;
    width: min(420px, 90vw);
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h3 { margin-bottom: 8px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .detail-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .detail-head h2 { font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Track<span>ary</span></h1>
  <div class="header-actions">
    <button id="export-btn" class="small" title="Download all data as JSON">Export</button>
    <button id="import-btn" class="small" title="Import data from a JSON export">Import</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  </div>
</header>

<main>
  <aside class="panel">
    <h2>Trackers</h2>
    <div id="tracker-list"></div>
    <button id="new-tracker-btn" class="primary" style="width:100%; margin-top:10px;">+ New tracker</button>
  </aside>

  <section class="panel" id="detail">
    <div class="empty">Select a tracker, or create one to get started.</div>
  </section>
</main>

<dialog id="tracker-dialog">
  <h3 id="tracker-dialog-title">New tracker</h3>
  <form method="dialog" id="tracker-form">
    <label for="t-name">Name</label>
    <input id="t-name" required maxlength="60" placeholder="e.g. Running, Coffee, Expenses">
    <label for="t-unit">Unit (optional)</label>
    <input id="t-unit" maxlength="20" placeholder="e.g. km, cups, $">
    <label for="t-color">Color</label>
    <input id="t-color" type="color" value="#5b8cff" style="height:40px; padding:4px;">
    <div class="dialog-actions">
      <button type="button" id="tracker-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "trackary.v1";

  /** @type {{trackers: Array<{id:string,name:string,unit:string,color:string,createdAt:string}>, entries: Array<{id:string,trackerId:string,value:number,note:string,at:string}>}} */
  let state = load();
  let selectedId = state.trackers[0] ? state.trackers[0].id : null;
  let editingId = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.trackers) && Array.isArray(parsed.entries)) return parsed;
      }
    } catch (e) { /* corrupted storage falls through to fresh state */ }
    return { trackers: [], entries: [] };
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  const $ = (sel) => document.querySelector(sel);

  // ---------- Tracker list ----------

  function renderList() {
    const list = $("#tracker-list");
    list.innerHTML = "";
    if (state.trackers.length === 0) {
      list.innerHTML = '<div class="muted">No trackers yet.</div>';
      return;
    }
    for (const t of state.trackers) {
      const count = state.entries.filter((e) => e.trackerId === t.id).length;
      const item = document.createElement("div");
      item.className = "tracker-item" + (t.id === selectedId ? " active" : "");
      item.innerHTML =
        '<span class="dot" style="background:' + t.color + '"></span>' +
        '<span class="name"></span><span class="count">' + count + "</span>";
      item.querySelector(".name").textContent = t.name;
      item.addEventListener("click", () => {
        selectedId = t.id;
        render();
      });
      list.appendChild(item);
    }
  }

  // ---------- Detail view ----------

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function dayKey(iso) {
    return iso.slice(0, 10);
  }

  function computeStats(entries) {
    const total = entries.reduce((s, e) => s + e.value, 0);
    const days = new Set(entries.map((e) => dayKey(e.at)));
    // Current streak: consecutive days ending today or yesterday with at least one entry.
    let streak = 0;
    const cursor = new Date();
    if (!days.has(cursor.toISOString().slice(0, 10))) cursor.setDate(cursor.getDate() - 1);
    while (days.has(cursor.toISOString().slice(0, 10))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return { count: entries.length, total, activeDays: days.size, streak };
  }

  function renderChart(entries) {
    // Last 14 days, summed per day.
    const days = [];
    const today = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    const sums = days.map((k) => entries.filter((e) => dayKey(e.at) === k).reduce((s, e) => s + e.value, 0));
    const max = Math.max(...sums, 1);
    return '<div class="chart">' + days.map((k, i) =>
      '<div class="bar" style="height:' + Math.round((sums[i] / max) * 100) + '%" data-tip="' +
      k.slice(5) + ": " + sums[i] + '"></div>'
    ).join("") + "</div>";
  }

  function render() {
    renderList();
    const detail = $("#detail");
    const t = state.trackers.find((x) => x.id === selectedId);
    if (!t) {
      detail.innerHTML = '<div class="empty">Select a tracker, or create one to get started.</div>';
      return;
    }
    const entries = state.entries
      .filter((e) => e.trackerId === t.id)
      .sort((a, b) => b.at.localeCompare(a.at));
    const s = computeStats(entries);
    const unit = t.unit ? " " + t.unit : "";

    detail.innerHTML =
      '<div class="detail-head">' +
        '<h2 id="d-name"></h2>' +
        '<div>' +
          '<button class="small" id="edit-tracker-btn">Edit</button> ' +
          '<button class="small danger" id="delete-tracker-btn">Delete</button>' +
        "</div>" +
      "</div>" +
      '<div class="stats">' +
        '<div class="stat"><div class="value">' + s.count + '</div><div class="label">Entries</div></div>' +
        '<div class="stat"><div class="value">' + (Math.round(s.total * 100) / 100) + '</div><div class="label">Total' + unit + "</div></div>" +
        '<div class="stat"><div class="value">' + s.activeDays + '</div><div class="label">Active days</div></div>' +
        '<div class="stat"><div class="value">' + s.streak + '</div><div class="label">Day streak</div></div>' +
      "</div>" +
      renderChart(entries) +
      '<form class="entry-form" id="entry-form">' +
        '<input name="value" type="number" step="any" value="1" required title="Amount">' +
        '<input name="note" placeholder="Note (optional)" maxlength="200">' +
        '<button type="submit" class="primary">Log' + (t.unit ? " " + t.unit : "") + "</button>" +
      "</form>" +
      (entries.length === 0
        ? '<div class="empty">No entries yet. Log your first one above.</div>'
        : '<table><thead><tr><th>When</th><th>Value</th><th>Note</th><th></th></tr></thead><tbody>' +
          entries.map((e) =>
            "<tr data-id=\"" + e.id + "\"><td>" + fmtDate(e.at) + '</td><td class="num">' + e.value + unit +
            '</td><td class="note-cell"></td>' +
            '<td><button class="small danger del-entry">✕</button></td></tr>'
          ).join("") +
          "</tbody></table>");

    $("#d-name").textContent = t.name;
    // Notes are user text; set via textContent to avoid HTML injection.
    detail.querySelectorAll("tbody tr").forEach((row, i) => {
      row.querySelector(".note-cell").textContent = entries[i].note || "";
    });

    $("#entry-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const form = ev.target;
      const value = parseFloat(form.value.value);
      if (!isFinite(value)) return;
      state.entries.push({
        id: uid(),
        trackerId: t.id,
        value,
        note: form.note.value.trim(),
        at: new Date().toISOString(),
      });
      save();
      render();
    });

    detail.querySelectorAll(".del-entry").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.closest("tr").dataset.id;
        state.entries = state.entries.filter((e) => e.id !== id);
        save();
        render();
      });
    });

    $("#edit-tracker-btn").addEventListener("click", () => openTrackerDialog(t));
    $("#delete-tracker-btn").addEventListener("click", () => {
      if (!confirm('Delete "' + t.name + '" and all its entries?')) return;
      state.trackers = state.trackers.filter((x) => x.id !== t.id);
      state.entries = state.entries.filter((e) => e.trackerId !== t.id);
      selectedId = state.trackers[0] ? state.trackers[0].id : null;
      save();
      render();
    });
  }

  // ---------- Tracker dialog ----------

  const dialog = $("#tracker-dialog");

  function openTrackerDialog(tracker) {
    editingId = tracker ? tracker.id : null;
    $("#tracker-dialog-title").textContent = tracker ? "Edit tracker" : "New tracker";
    $("#t-name").value = tracker ? tracker.name : "";
    $("#t-unit").value = tracker ? tracker.unit : "";
    $("#t-color").value = tracker ? tracker.color : "#5b8cff";
    dialog.showModal();
  }

  $("#new-tracker-btn").addEventListener("click", () => openTrackerDialog(null));
  $("#tracker-cancel").addEventListener("click", () => dialog.close());

  $("#tracker-form").addEventListener("submit", () => {
    const name = $("#t-name").value.trim();
    if (!name) return;
    const unit = $("#t-unit").value.trim();
    const color = $("#t-color").value;
    if (editingId) {
      const t = state.trackers.find((x) => x.id === editingId);
      Object.assign(t, { name, unit, color });
    } else {
      const t = { id: uid(), name, unit, color, createdAt: new Date().toISOString() };
      state.trackers.push(t);
      selectedId = t.id;
    }
    save();
    render();
  });

  // ---------- Export / import ----------

  $("#export-btn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "trackary-export-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("#import-btn").addEventListener("click", () => $("#import-file").click());
  $("#import-file").addEventListener("change", (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    file.text().then((text) => {
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.trackers) || !Array.isArray(parsed.entries)) {
        throw new Error("Not a Trackary export");
      }
      if (!confirm("Replace current data with imported data?")) return;
      state = parsed;
      selectedId = state.trackers[0] ? state.trackers[0].id : null;
      save();
      render();
    }).catch((err) => alert("Import failed: " + err.message));
    ev.target.value = "";
  });

  render();
})();
</script>
</body>
</html>
